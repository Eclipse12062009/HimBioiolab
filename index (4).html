<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Биолаб и Химлаб — игры по биологии и химии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1ECF5; --surface:#FFFFFF; --ink:#2A1B3D; --muted:#6D5F80; --line:#DCD2E6;
  --eosin:#D6336C; --eosin-soft:#FBE3EC; --hema:#3B4FA0; --hema-soft:#E3E7F8;
  --ok:#2B8A57; --ok-soft:#DDF3E6; --amber:#C98A00; --slide:#F8F3FA;
  --nA:#2B8A57; --nT:#D6336C; --nU:#B0306E; --nG:#3B4FA0; --nC:#C98A00;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1426; --surface:#271D36; --ink:#EDE6F5; --muted:#A99BBD; --line:#3A2E4D;
    --eosin:#F06595; --eosin-soft:#4A2034; --hema:#8C9EFF; --hema-soft:#262C52;
    --ok:#4CC38A; --ok-soft:#1D3B2C; --amber:#F2B632; --slide:#231A31;
    --nA:#4CC38A; --nT:#F06595; --nU:#E36BA8; --nG:#8C9EFF; --nC:#F2B632;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1426; --surface:#271D36; --ink:#EDE6F5; --muted:#A99BBD; --line:#3A2E4D;
  --eosin:#F06595; --eosin-soft:#4A2034; --hema:#8C9EFF; --hema-soft:#262C52;
  --ok:#4CC38A; --ok-soft:#1D3B2C; --amber:#F2B632; --slide:#231A31;
  --nA:#4CC38A; --nT:#F06595; --nU:#E36BA8; --nG:#8C9EFF; --nC:#F2B632;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding:20px 20px 140px}
h1,h2,.display{font-family:"Unbounded","Arial Black",system-ui,sans-serif;letter-spacing:-.01em;margin:0}
h1{font-size:44px;line-height:1.05;font-weight:800}
h2{font-size:26px;line-height:1.15;font-weight:800}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--hema);outline-offset:2px}
.primary{display:block;width:100%;padding:17px 20px;border-radius:16px;background:var(--eosin);color:#fff;
  font-weight:600;font-size:18px}
.primary:active{transform:scale(.98)}
.muted{color:var(--muted)}

/* start */
.slide{width:220px;height:220px;margin:8px auto 24px;display:block}
.start .lead{margin:14px 0 22px;color:var(--muted)}
.levels{list-style:none;padding:0;margin:0 0 22px;counter-reset:l}
.levels li{counter-increment:l;display:flex;gap:14px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.levels li::before{content:counter(l);font-family:"Unbounded",sans-serif;font-weight:800;color:var(--eosin);width:18px}
.levels b{font-weight:600}
.best{margin-bottom:16px;color:var(--muted);font-size:15px}

/* intro */
.intro{padding-top:40px}
.intro .step{color:var(--eosin);font-weight:600;margin-bottom:10px}
.intro .rule{margin:18px 0 30px;font-size:18px}

/* hud */
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.lives{display:flex;gap:6px}
.cell{width:22px;height:22px;border-radius:50%;background:var(--eosin-soft);border:2px solid var(--eosin);position:relative}
.cell::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--hema)}
.cell.dead{border-color:var(--line);background:transparent}
.cell.dead::after{background:var(--line)}
.score{font-family:"Unbounded",sans-serif;font-weight:800;font-size:20px}
.streak{font-size:13px;color:var(--eosin);font-weight:600;text-align:right;min-height:18px}
.progress{display:flex;gap:4px;margin:10px 0 22px}
.progress span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress span.done{background:var(--hema)}
.progress span.now{background:var(--eosin)}
.topic{font-size:14px;color:var(--muted)}
.q{font-size:20px;font-weight:600;line-height:1.35;margin-bottom:20px}

/* strands */
.label{font-size:14px;color:var(--muted);margin:0 0 8px}
.strand{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.triplet{display:flex;gap:3px;padding:4px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.nt{width:34px;height:40px;border-radius:7px;display:grid;place-items:center;font-weight:600;font-size:19px;color:#fff}
.nt.empty{background:transparent;border:2px dashed var(--line);color:transparent}
.nt.cur{border-color:var(--eosin);border-style:solid}
.n-a{background:var(--nA)}.n-t{background:var(--nT)}.n-u{background:var(--nU)}.n-g{background:var(--nG)}.n-c{background:var(--nC)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.pad button{height:68px;border-radius:16px;font-size:26px;font-weight:600;color:#fff}

/* options */
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:16px 18px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-size:17px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--eosin);background:var(--eosin-soft)}
.card{padding:22px 20px;border-radius:18px;background:var(--surface);border:2px solid var(--hema);font-size:19px;font-weight:600;margin-bottom:20px;line-height:1.35}

/* chain */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:52px;padding:10px;border-radius:14px;border:2px dashed var(--line);margin-bottom:18px}
.chain .link{padding:8px 12px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:15px}
.chain .arr{color:var(--muted)}
.chain .hint{color:var(--muted);font-size:15px}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.pool button{padding:12px 16px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-weight:500}

/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:3px solid var(--ok);
  padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(42,27,61,.18);
  animation:up .25s ease-out}
.sheet.bad{border-top-color:var(--eosin)}
.sheet-in{max-width:480px;margin:0 auto}
.sheet h3{margin:0 0 6px;font-size:19px;color:var(--ok)}
.sheet.bad h3{color:var(--eosin)}
.sheet p{font-size:15px;margin-bottom:14px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}

/* results */
.result{padding-top:24px}
.big{font-family:"Unbounded",sans-serif;font-weight:800;font-size:64px;line-height:1;margin:18px 0 6px;color:var(--eosin)}
.rank{font-size:20px;font-weight:600;margin-bottom:24px}
.row{padding:12px 0;border-top:1px solid var(--line)}
.row-top{display:flex;justify-content:space-between;font-size:16px;margin-bottom:6px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hema)}
.tip{margin:20px 0 24px;padding:14px 16px;border-radius:14px;background:var(--hema-soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.slide{width:150px;height:150px;margin:4px 0 18px}
.total{color:var(--muted);font-size:15px;margin-top:6px}
.total b{color:var(--amber)}
.grades{display:flex;gap:8px;overflow-x:auto;margin:20px -20px 4px;padding:2px 20px 8px;scrollbar-width:none}
.grades button{flex:0 0 auto;padding:9px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:16px}
.grades button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lvl{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 0;border-top:1px solid var(--line)}
.lvl b{display:block;font-weight:600}
.lvl small{color:var(--muted);font-size:14px}
.stars{color:var(--amber);font-size:17px;letter-spacing:2px;white-space:nowrap}
.stars .off{color:var(--line)}
.sheet{max-height:72vh;overflow-y:auto}
.sheet .yours{font-size:15px;margin-bottom:8px}
.sol{padding:12px 14px;border-radius:12px;background:var(--hema-soft);font-size:15px;margin-bottom:14px;line-height:1.45}
.sol b{display:block;margin-bottom:3px}
.secondary{display:block;width:100%;padding:15px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:17px;margin-top:10px}
.back{color:var(--muted);font-size:15px;padding:4px 0;margin-bottom:10px}
.opts.many{grid-template-columns:1fr 1fr}
.opts.many .opt{padding:14px 12px;font-size:15px}
.result .stars{font-size:34px;margin:10px 0 4px}

.quiz{margin:22px 0 4px;padding:18px;border-radius:18px;background:var(--hema-soft)}
.quiz h3{margin:0 0 4px;font-family:"Unbounded","Arial Black",sans-serif;font-size:18px;font-weight:800;color:var(--hema)}
.quiz p{font-size:15px;color:var(--muted);margin-bottom:12px}
.qbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qbtns button{padding:12px 6px;border-radius:14px;background:var(--surface);border:2px solid var(--hema);text-align:center}
.qbtns b{display:block;font-family:"Unbounded",sans-serif;font-size:24px;color:var(--hema)}
.qbtns small{font-size:13px;color:var(--muted)}

.subj{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:14px}
.subj button{padding:10px;border-radius:10px;font-weight:600;color:var(--muted)}
.subj button.on{background:var(--eosin);color:#fff}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;padding:18px 14px;border-radius:16px;background:var(--surface);border:2px solid var(--line);margin-bottom:10px}
.sub{display:inline-flex;align-items:center;gap:4px}
.f{font-size:22px;font-weight:600;white-space:nowrap}
.op{font-size:20px;color:var(--muted);padding:0 2px}
.coef{min-width:40px;height:44px;border-radius:10px;border:2px solid var(--hema);background:var(--hema-soft);color:var(--hema);font-family:"Unbounded",sans-serif;font-weight:800;font-size:18px}
.coef.one{border-style:dashed;opacity:.7}
.hint-line{min-height:24px;font-size:15px;color:var(--eosin);margin-bottom:12px}

.rvlink{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;margin-top:18px;padding:16px;border-radius:16px;background:var(--surface);border:2px solid var(--line)}
.rvlink b{display:block;font-weight:600}
.rvlink small{color:var(--muted);font-size:14px}
.reviews h2{margin-bottom:4px}
.rvform{padding:18px;border-radius:18px;background:var(--surface);border:2px solid var(--line);margin-bottom:22px}
.rvform h3{margin:0 0 12px;font-family:"Unbounded","Arial Black",sans-serif;font-size:18px;font-weight:800}
.fl{display:block;font-size:14px;color:var(--muted);margin-bottom:12px}
.inp{display:block;width:100%;margin-top:5px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.inp:focus{outline:none;border-color:var(--hema)}
.area{resize:vertical;min-height:92px;line-height:1.45}
.rate{display:flex;gap:6px;margin:0 0 16px}
.rate button{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--line);font-size:24px;line-height:1}
.rate button.on{color:var(--amber);border-color:var(--amber)}
.rvnote{margin-top:12px;font-size:15px;color:var(--hema)}
.rv{padding:14px 0;border-top:1px solid var(--line)}
.rv-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rv-top b{font-weight:600}
.stars.sm{font-size:15px}
.rv-who{font-size:14px;color:var(--muted);margin-top:2px}
.rv-text{margin-top:6px;line-height:1.45}
.rv-del{margin-top:8px;font-size:14px;color:var(--eosin);text-decoration:underline}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $app = document.getElementById('app');
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a };
const COMP = {'А':'У','Т':'А','Г':'Ц','Ц':'Г'};
const NCLS = {'А':'a','Т':'t','У':'u','Г':'g','Ц':'c'};

/* Конструкторы заданий */
const M = (q,ans,wrong,expl) => ({type:'mc',q,ans,wrong,expl});
const C = (q,ans,expl) => ({type:'card',q,ans,expl});
const O = (q,items,expl) => ({type:'order',q,items,expl});

/* Генераторы */
function genDNA(n){
  let s=''; for(let i=0;i<n;i++) s+=rnd(['А','Т','Г','Ц']);
  return {type:'dna',strand:s,expl:'По принципу комплементарности: А→У, Т→А, Г→Ц, Ц→Г. В РНК вместо тимина (Т) стоит урацил (У).'};
}
function genChargaff(){
  const a = rnd([10,15,20,30,35,40]);
  return M(`В молекуле ДНК ${a}% нуклеотидов содержат аденин. Сколько процентов приходится на гуанин?`,`${50-a}%`,[`${a}%`,`${100-2*a}%`,`${100-a}%`],
    `По правилу Чаргаффа А = Т, Г = Ц. Значит А + Т = ${a} + ${a} = ${2*a}%. На Г + Ц остаётся 100 − ${2*a} = ${100-2*a}%, а Г = ${100-2*a} : 2 = ${50-a}%.`);
}
function genCodons(){
  const k = rnd([7,9,12,15,21]);
  return M(`Участок иРНК содержит ${k*3} нуклеотидов. Сколько аминокислот он кодирует (без учёта стоп-кодонов)?`,`${k}`,[`${k*3}`,`${k*2}`,`${k*6}`],
    `Каждую аминокислоту кодирует триплет — 3 нуклеотида. ${k*3} : 3 = ${k} аминокислот.`);
}
function genBiomass(){
  const c = rnd([
    {chain:['Растения','Мышь','Змея','Орёл'],who:'орёл'},
    {chain:['Планктон','Рыба','Тюлень'],who:'тюлень'},
    {chain:['Трава','Кролик','Лиса'],who:'лиса'},
    {chain:['Водоросли','Моллюски','Рыба','Выдра'],who:'выдра'}]);
  const m = rnd([2,3,4,5,6,8]); const steps=c.chain.length-1; const need=m*Math.pow(10,steps);
  const f = n => n.toLocaleString('ru-RU')+' кг';
  return M(`Цепь питания: ${c.chain.join(' → ')}. Сколько килограммов первого звена нужно, чтобы ${c.who} набрал(а) ${m} кг массы? Используй правило 10 %.`,
    f(need),[f(need/10),f(need*10),f(m*10*steps)],
    `На следующий трофический уровень переходит около 10 % энергии (массы), значит на каждом шаге вниз по цепи масса растёт в 10 раз. Переходов от продуцента до конечного консумента: ${steps}. ${m} × ${Math.pow(10,steps).toLocaleString('ru-RU')} = ${f(need)}.`);
}

/* ---------- Уровни ---------- */
const LEVELS = [
/* 5 класс */
{id:'5a',grade:5,name:'Клетка и микроскоп',short:'Увеличительные приборы, строение клетки',n:6,
 rule:'Вспомни устройство микроскопа и строение растительной клетки.',
 bank:[
  M('Какие части светового микроскопа увеличивают изображение?','Окуляр и объектив',['Зеркало и диафрагма','Предметный столик','Тубус и штатив'],'Увеличивают изображение линзы — окуляр (у глаза) и объектив (у препарата). Зеркало только направляет свет, столик держит препарат.'),
  M('Окуляр увеличивает в 10 раз, объектив — в 40. Каково общее увеличение микроскопа?','400',['50','30','4000'],'Общее увеличение = увеличение окуляра × увеличение объектива = 10 × 40 = 400 раз. Складывать нельзя.'),
  M('Какой органоид есть в клетке растения, но отсутствует в клетке животного?','Хлоропласт',['Ядро','Митохондрия','Цитоплазма'],'Хлоропласты содержат хлорофилл и обеспечивают фотосинтез. Ядро, митохондрии и цитоплазма есть и у животных клеток.'),
  M('Кто впервые увидел клетки, рассматривая срез пробки?','Роберт Гук',['Антони ван Левенгук','Чарлз Дарвин','Грегор Мендель'],'В 1665 году Роберт Гук рассмотрел срез пробки в свой микроскоп и назвал ячейки «клетками». Левенгук позже первым увидел живые микроорганизмы.'),
  M('Какая часть клетки хранит наследственную информацию и управляет её жизнью?','Ядро',['Вакуоль','Клеточная стенка','Хлоропласт'],'В ядре находятся хромосомы с ДНК — наследственная информация. Через неё ядро управляет всеми процессами клетки.'),
  M('Что придаёт клетке растения прочность и постоянную форму?','Клеточная стенка',['Цитоплазма','Ядро','Хлоропласт'],'Клеточная стенка из целлюлозы — прочный каркас снаружи мембраны. У животных клеток её нет, поэтому их форма может меняться.'),
  M('Где в клетке растения накапливается клеточный сок?','В вакуоли',['В ядре','В хлоропласте','В клеточной стенке'],'Вакуоль — полость с клеточным соком (вода, сахара, соли, пигменты). У старых клеток она занимает почти всю клетку.'),
  O('Расставь по порядку этапы приготовления препарата кожицы лука',['Протереть предметное стекло','Капнуть на стекло воду','Положить в каплю кожицу лука','Накрыть покровным стеклом','Рассмотреть под микроскопом'],'Стекло должно быть чистым, кожица — в капле воды, чтобы не высохла. Покровное стекло кладут сверху, и только после этого препарат рассматривают.'),
 ]},
{id:'5b',grade:5,name:'Царства живой природы',short:'Бактерии, грибы, растения, животные',n:7,
 rule:'Определи, к какому царству относится организм.',
 cats:['Бактерии','Грибы','Растения','Животные'],
 bank:[
  C('Кишечная палочка','Бактерии','Одноклеточный организм без оформленного ядра — это главный признак бактерий.'),
  C('Клубеньковые бактерии на корнях гороха','Бактерии','Бактерии-симбионты: усваивают азот воздуха и снабжают им растение.'),
  C('Холерный вибрион','Бактерии','Болезнетворная бактерия в форме запятой, клетка без ядра.'),
  C('Мукор (белая плесень)','Грибы','Плесневый гриб: тело из гиф, питается готовой органикой, размножается спорами.'),
  C('Дрожжи','Грибы','Одноклеточные грибы. Размножаются почкованием, сбраживают сахар — поэтому тесто поднимается.'),
  C('Подберёзовик','Грибы','Шляпочный гриб: грибница в почве, плодовое тело над землёй. Хлорофилла нет.'),
  C('Хлорелла','Растения','Одноклеточная зелёная водоросль с хлоропластом. Водоросли изучают в царстве Растения.'),

{id:'6b',grade:6,name:'Жизнедеятельность растений',short:'Фотосинтез, дыхание, размножение',n:6,

 rule:'Проследи путь пищи и воздуха в организме человека.',

  M('Где начинается расщепление белков?','В желудке',['В ротовой полости','В толстом кишечнике','В пищеводе'],'Фермент пепсин желудочного сока работает в кислой среде (соляная кислота) и расщепляет белки. В слюне ферментов для белков нет.'),
  M('Что расщепляют ферменты слюны?','Крахмал',['Белки','Жиры','Клетчатку'],'Амилаза слюны начинает расщеплять крахмал до мальтозы. Поэтому хлеб при долгом жевании становится сладковатым.'),
  M('Где образуется желчь?','В печени',['В желчном пузыре','В поджелудочной железе','В желудке'],'Желчь вырабатывает печень, а желчный пузырь только её накапливает. Желчь эмульгирует жиры — дробит их на мелкие капли.'),
  M('Где идёт основное всасывание питательных веществ?','В тонком кишечнике',['В желудке','В толстом кишечнике','В пищеводе'],'Ворсинки тонкой кишки сильно увеличивают площадь. Аминокислоты и глюкоза всасываются в кровь, жиры — в лимфу.'),
  M('Где происходит газообмен в лёгких?','В альвеолах',['В бронхах','В трахее','В гортани'],'Стенки альвеол и капилляров очень тонкие. O₂ диффундирует в кровь, CO₂ — из крови в воздух.'),
  M('Где находится дыхательный центр?','В продолговатом мозге',['В мозжечке','В коре больших полушарий','В спинном мозге'],'Продолговатый мозг автоматически управляет дыханием, реагируя на уровень CO₂ в крови.'),
  M('Что происходит с диафрагмой при вдохе?','Сокращается и уплощается',['Расслабляется и становится куполом','Не меняется','Поднимается вверх'],'Сокращение диафрагмы увеличивает объём грудной полости, давление в лёгких падает, и воздух входит внутрь.'),
  O('Расставь органы по пути пищи',['Ротовая полость','Глотка','Пищевод','Желудок','Двенадцатиперстная кишка','Тонкий кишечник','Толстый кишечник'],'Двенадцатиперстная кишка — начальный отдел тонкого кишечника: в неё открываются протоки печени и поджелудочной железы.'),
  O('Расставь путь воздуха при вдохе',['Носовая полость','Носоглотка','Гортань','Трахея','Бронхи','Альвеолы'],'В носовой полости воздух согревается, увлажняется и очищается, затем через гортань и трахею по бронхам попадает в альвеолы.'),
 ]},
{id:'9c',grade:9,name:'Нервная система и анализаторы',short:'Мозг, рефлексы, зрение, слух',n:6,
 rule:'Вопросы о нервной регуляции и органах чувств.',
 bank:[
  M('Какой отдел мозга координирует движения и поддерживает равновесие?','Мозжечок',['Продолговатый мозг','Промежуточный мозг','Средний мозг'],'При повреждении мозжечка движения становятся неточными, походка шаткой, нарушается равновесие.'),
  M('В какой доле коры находится зрительная зона?','В затылочной',['В лобной','В височной','В теменной'],'Затылочная доля обрабатывает зрение, височная — слух, теменная — кожно-мышечную чувствительность, лобная — мышление и произвольные движения.'),
  M('Какие фоторецепторы отвечают за цветное зрение?','Колбочки',['Палочки','Хрусталик','Радужка'],'Колбочки работают при ярком свете и различают цвета. Палочки — для сумеречного чёрно-белого зрения.'),
  M('Какими линзами корректируют близорукость?','Рассеивающими (вогнутыми)',['Собирающими (выпуклыми)','Цилиндрическими','Линзы не помогают'],'При близорукости изображение фокусируется перед сетчаткой. Рассеивающая линза отодвигает фокус назад, на сетчатку.'),
  M('Чем условный рефлекс отличается от безусловного?','Приобретается в течение жизни',['Передаётся по наследству','Одинаков у всех особей вида','Сохраняется без подкрепления всегда'],'Условные рефлексы индивидуальны, вырабатываются при сочетании с безусловным и угасают без подкрепления (И. П. Павлов).'),
  M('Где расположены слуховые рецепторы?','В улитке внутреннего уха',['В барабанной перепонке','В слуховых косточках','В полукружных каналах'],'Волосковые клетки кортиева органа в улитке превращают колебания жидкости в нервные импульсы. Полукружные каналы — орган равновесия.'),
  M('Что регулирует вегетативная нервная система?','Работу внутренних органов',['Сокращения скелетных мышц','Речь и мышление','Произвольные движения'],'Вегетативная система управляет сердцем, сосудами, пищеварением, железами и не подчиняется воле. Скелетные мышцы — соматическая система.'),
  O('Расставь звенья рефлекторной дуги',['Рецептор','Чувствительный нейрон','Вставочный нейрон','Двигательный нейрон','Рабочий орган'],'Рецептор воспринимает раздражение, импульс по чувствительному нейрону идёт в ЦНС, через вставочный нейрон передаётся на двигательный и к мышце или железе.'),
  O('Расставь путь звуковой волны',['Ушная раковина','Наружный слуховой проход','Барабанная перепонка','Слуховые косточки','Улитка','Слуховой нерв'],'Звук улавливается раковиной, колеблет перепонку, косточки (молоточек, наковальня, стремечко) усиливают колебания и передают их в улитку, оттуда импульс идёт по нерву в височную долю.'),
 ]},

{id:'10a',grade:10,name:'Молекулярная биология',short:'ДНК, РНК, белки, генетический код',n:3,
 rule:'Собери иРНК по матричной цепи ДНК, нажимая на нуклеотиды по порядку. Затем — задачи на правило Чаргаффа и генетический код.',
 extra:()=>[genDNA(6),genDNA(9),genChargaff(),genCodons()],
 bank:[
  M('Что является мономером белков?','Аминокислоты',['Нуклеотиды','Моносахариды','Жирные кислоты'],'Белки — полимеры из 20 видов аминокислот, соединённых пептидными связями. Нуклеотиды — мономеры нуклеиновых кислот.'),
  M('Какие связи удерживают две цепи ДНК вместе?','Водородные',['Пептидные','Ионные','Дисульфидные'],'Между А и Т образуются две водородные связи, между Г и Ц — три. Поэтому цепи легко расходятся при репликации.'),
  M('Где в клетке синтезируется белок?','На рибосомах',['В ядрышке','В лизосомах','В аппарате Гольджи'],'На рибосомах идёт трансляция: иРНК считывается, тРНК приносят аминокислоты. В ядрышке собираются сами рибосомы.'),
  M('Сколько нуклеотидов в одном кодоне?','Три',['Два','Четыре','Один'],'Код триплетный: 4³ = 64 сочетания хватает на 20 аминокислот и стоп-сигналы.'),
  M('Какое свойство генетического кода означает, что одну аминокислоту могут кодировать несколько триплетов?','Вырожденность',['Однозначность','Универсальность','Неперекрываемость'],'Кодонов 61, а аминокислот 20 — большинство аминокислот кодируется 2–6 триплетами. Однозначность — обратное: триплет кодирует одну аминокислоту.'),
 ]},
{id:'10b',grade:10,name:'Деление клетки',short:'Митоз, мейоз, наборы хромосом',n:6,
 rule:'Вопросы о жизненном цикле клетки, митозе и мейозе.',
 bank:[
  M('В какой фазе митоза хромосомы выстраиваются по экватору клетки?','Метафаза',['Профаза','Анафаза','Телофаза'],'В метафазе хромосомы максимально спирализованы и лежат в экваториальной плоскости — поэтому их удобно считать под микроскопом.'),
  M('Что образуется из одной клетки в результате мейоза?','Четыре гаплоидные клетки',['Две диплоидные','Две гаплоидные','Четыре диплоидные'],'Мейоз — два деления подряд без удвоения ДНК между ними. Набор уменьшается с 2n до n, получаются 4 клетки.'),
  M('Когда происходит кроссинговер?','В профазе I мейоза',['В метафазе митоза','В анафазе II мейоза','В интерфазе'],'В профазе I гомологичные хромосомы сближаются (конъюгация) и обмениваются участками. Это источник комбинативной изменчивости.'),
  M('Когда удваивается ДНК?','В синтетическом периоде интерфазы',['В профазе','В анафазе','В телофазе'],'В S-периоде интерфазы идёт репликация: каждая хромосома становится двухроматидной. Набор меняется с 2n2c на 2n4c.'),
  M('В соматических клетках человека 46 хромосом. Сколько хромосом в сперматозоиде?','23',['46','92','22'],'Гаметы образуются мейозом и гаплоидны: 46 : 2 = 23. При оплодотворении набор восстанавливается до 46.'),
  M('Каков набор хромосом и ДНК в клетке перед началом митоза?','2n4c',['2n2c','n2c','4n4c'],'После S-периода хромосом по-прежнему 2n, но каждая из двух хроматид, поэтому ДНК вдвое больше — 4c.'),
  M('Что расходится к полюсам в анафазе митоза?','Сестринские хроматиды',['Гомологичные хромосомы','Целые двухроматидные хромосомы','Ядрышки'],'В анафазе митоза центромеры делятся, и хроматиды становятся самостоятельными хромосомами. Гомологичные хромосомы расходятся в анафазе I мейоза.'),
  O('Расставь фазы митоза по порядку',['Профаза','Метафаза','Анафаза','Телофаза'],'Профаза — спирализация, распад оболочки ядра; метафаза — хромосомы на экваторе; анафаза — расхождение хроматид; телофаза — образование двух ядер.'),
 ]},
{id:'10c',grade:10,name:'Генетика',short:'Законы Менделя, сцепление с полом',n:5,
 rule:'Определи расщепление и вероятности. Если не сказано иное — доминирование полное, гены в разных хромосомах.',
 bank:[
  M('Aa × Aa при полном доминировании. Каким будет расщепление по фенотипу?','3 : 1',['1 : 2 : 1','1 : 1','9 : 3 : 3 : 1'],'Гаметы A и a от каждого родителя дают 1AA : 2Aa : 1aa. AA и Aa выглядят одинаково, поэтому по фенотипу 3 : 1 (второй закон Менделя).'),
  M('Aa × Aa. Каким будет расщепление по генотипу?','1 : 2 : 1',['3 : 1','1 : 1','1 : 1 : 1 : 1'],'Решётка Пеннета: AA, Aa, aA, aa. Гетерозигот вдвое больше, чем каждой гомозиготы — 1 : 2 : 1.'),
  M('Анализирующее скрещивание Aa × aa. Расщепление по фенотипу?','1 : 1',['3 : 1','1 : 2 : 1','Всё потомство одинаково'],'Гетерозигота даёт гаметы A и a поровну, рецессивная гомозигота — только a. Потомство: Aa и aa в соотношении 1 : 1.'),
  M('AaBb × AaBb, гены в разных хромосомах. Расщепление по фенотипу?','9 : 3 : 3 : 1',['1 : 1 : 1 : 1','3 : 1','1 : 2 : 1'],'Каждый признак расщепляется 3 : 1 независимо (третий закон Менделя). (3 : 1) × (3 : 1) = 9 : 3 : 3 : 1.'),
  M('AaBb × aabb, гены не сцеплены. Расщепление по фенотипу?','1 : 1 : 1 : 1',['9 : 3 : 3 : 1','3 : 1','1 : 1'],'Дигетерозигота даёт 4 типа гамет поровну: AB, Ab, aB, ab. Каждая сливается с ab — получаются 4 фенотипа поровну.'),
  M('Неполное доминирование у ночной красавицы: Rr (розовые) × Rr. Соотношение красные : розовые : белые?','1 : 2 : 1',['3 : 1','1 : 1 : 0','9 : 3 : 4'],'При неполном доминировании гетерозигота Rr имеет промежуточный (розовый) цвет, поэтому расщепление по фенотипу совпадает с генотипом: 1RR : 2Rr : 1rr.'),
  M('Мать — носительница гемофилии (XᴴXʰ), отец здоров (XᴴY). Какова вероятность рождения больного ребёнка?','25%',['50%','0%','100%'],'Дети: XᴴXᴴ, XᴴXʰ, XᴴY, XʰY — по 1/4. Болен только XʰY, то есть 1/4 всех детей (или половина сыновей).'),
  M('Мать — дальтоник (XᵈXᵈ), отец видит нормально (XᴰY). Какая доля сыновей будет дальтониками?','100%',['50%','25%','0%'],'Сын получает X-хромосому только от матери, а у неё обе с геном d. Все сыновья XᵈY — дальтоники; дочери XᴰXᵈ — здоровые носительницы.'),
  M('Родители со II (IᴬI⁰) и III (IᴮI⁰) группами крови. Вероятность ребёнка с I группой?','25%',['0%','50%','75%'],'I группа — I⁰I⁰. Вероятность получить I⁰ от каждого родителя — 1/2, вместе 1/2 × 1/2 = 1/4. Возможны все четыре группы по 25%.'),
 ]},

  M('Что является рудиментом у человека?','Копчик',['Хвост у новорождённого','Многососковость','Сплошной волосяной покров'],'Рудимент есть у всех людей и утратил функцию (копчик, аппендикс). Хвост, многососковость и густой волосяной покров — атавизмы: редкие проявления признаков предков.'),

const fmt = x => (Math.round(x*100)/100).toLocaleString('ru-RU');
const COMPOUNDS = [
  ['H₂O',[['H',1,2],['O',16,1]]], ['CO₂',[['C',12,1],['O',16,2]]], ['H₂SO₄',[['H',1,2],['S',32,1],['O',16,4]]],
  ['NaOH',[['Na',23,1],['O',16,1],['H',1,1]]], ['CaCO₃',[['Ca',40,1],['C',12,1],['O',16,3]]], ['HNO₃',[['H',1,1],['N',14,1],['O',16,3]]],
  ['Fe₂O₃',[['Fe',56,2],['O',16,3]]], ['Al₂O₃',[['Al',27,2],['O',16,3]]], ['SO₂',[['S',32,1],['O',16,2]]],
  ['NH₃',[['N',14,1],['H',1,3]]], ['Ca(OH)₂',[['Ca',40,1],['O',16,2],['H',1,2]]], ['H₃PO₄',[['H',1,3],['P',31,1],['O',16,4]]],
  ['MgO',[['Mg',24,1],['O',16,1]]], ['CuSO₄',[['Cu',64,1],['S',32,1],['O',16,4]]],
];
const molar = c => c[1].reduce((s,[,a,k])=>s+a*k,0);
const molarExpl = c => `M(${c[0]}) = ${c[1].map(([,a,k])=>k>1?`${k}·${a}`:`${a}`).join(' + ')} = ${molar(c)}`;
function genMr(){
  const c = rnd(COMPOUNDS), M = molar(c), noIdx = c[1].reduce((s,[,a])=>s+a,0);
  return M_(`Вычисли относительную молекулярную массу ${c[0]}. Ar: ${c[1].map(([s,a])=>`${s} = ${a}`).join(', ')}.`,
    `${M}`,[`${noIdx}`,`${M+16}`,`${M*2}`],
    `Складываем атомные массы с учётом индексов: M${molarExpl(c).slice(1)}. Индекс показывает, сколько атомов элемента в молекуле.`);
}
function genMoles(){
  const c = rnd(COMPOUNDS), M = molar(c), n = rnd([0.5,2,3,0.25,4]), m = n*M;
  return M_(`Какое количество вещества составляет ${fmt(m)} г ${c[0]}?`,`${fmt(n)} моль`,[`${fmt(n*2)} моль`,`${fmt(n/2)} моль`,`${fmt(n*10)} моль`],
    `n = m / M. Сначала находим молярную массу: ${molarExpl(c)} г/моль. Затем n = ${fmt(m)} : ${M} = ${fmt(n)} моль.`);
}
function genGas(){
  const g = rnd(['кислорода O₂','водорода H₂','азота N₂','углекислого газа CO₂']), n = rnd([0.5,1.5,2,3,5]), V = n*22.4;
  return M_(`Какой объём при нормальных условиях занимают ${fmt(n)} моль ${g}?`,`${fmt(V)} л`,[`${fmt(V/2)} л`,`${fmt(V*2)} л`,`${fmt(n+22.4)} л`],
    `При н. у. 1 моль любого газа занимает 22,4 л (молярный объём Vm). V = n · Vm = ${fmt(n)} · 22,4 = ${fmt(V)} л. Вид газа на ответ не влияет.`);
}
function genSolution(){
  const [ms,total,w] = rnd([[10,200,5],[20,200,10],[30,250,12],[25,500,5],[40,160,25],[15,300,5],[50,200,25],[30,150,20]]);
  const mw = total-ms;
  return M_(`В ${mw} г воды растворили ${ms} г соли. Какова массовая доля соли в растворе?`,`${fmt(w)}%`,[`${fmt(ms/mw*100)}%`,`${fmt(w*2)}%`,`${fmt(100-w)}%`],
    `Масса раствора = масса соли + масса воды = ${ms} + ${mw} = ${total} г. ω = m(соли) / m(раствора) · 100% = ${ms} : ${total} · 100% = ${fmt(w)}%. Частая ошибка — делить на массу воды, а не раствора.`);
}
function genAtom(){
  const [name,Z,A] = rnd([['натрия Na',11,23],['алюминия Al',13,27],['фосфора P',15,31],['хлора Cl',17,35],['калия K',19,39],['железа Fe',26,56],['меди Cu',29,64],['цинка Zn',30,65]]);
  if(Math.random()<.5) return M_(`Атом ${name}: порядковый номер ${Z}, массовое число ${A}. Сколько в ядре нейтронов?`,`${A-Z}`,[`${Z}`,`${A}`,`${A+Z}`],
    `Порядковый номер = число протонов (${Z}). Массовое число = протоны + нейтроны. Нейтронов: ${A} − ${Z} = ${A-Z}.`);
  return M_(`Атом ${name}: порядковый номер ${Z}, массовое число ${A}. Сколько в атоме электронов?`,`${Z}`,[`${A-Z}`,`${A}`,`${Z+1}`],
    `Атом электронейтрален: электронов столько же, сколько протонов, то есть равно порядковому номеру — ${Z}.`);
}
function genVanthoff(){
  const g = rnd([2,3]), dT = rnd([20,30,40].filter(x=>!(g===3&&x===40))), k = dT/10, r = Math.pow(g,k);
  return M_(`Температурный коэффициент реакции γ = ${g}. Во сколько раз возрастёт скорость при нагревании на ${dT} °C?`,`в ${r} раз(а)`,
    [`в ${g*k} раз(а)`,`в ${dT} раз`,`в ${Math.pow(g,k+1)} раз(а)`,`в ${k} раз(а)`],
    `Правило Вант-Гоффа: v₂/v₁ = γ^(ΔT/10) = ${g}^(${dT}/10) = ${g}^${k} = ${r}. Скорость растёт в степени, а не умножается на число десятков градусов.`);
}
function M_(q,ans,wrong,expl){ return {type:'mc',q,ans,wrong,expl}; }

 ]},

{id:'9d',subject:'bio',grade:9,name:'Опора и движение',short:'Скелет, мышцы, первая помощь',n:6,

 ]},
{id:'9e',subject:'bio',grade:9,name:'Обмен веществ, кожа и выделение',short:'Витамины, почки, терморегуляция',n:6,
 rule:'Вопросы об обмене веществ, коже и выделительной системе.',

  M('Как называется структурная единица почки?','Нефрон',['Нейрон','Альвеола','Ворсинка'],'В каждой почке около миллиона нефронов. Каждый состоит из капсулы с клубочком капилляров и системы канальцев.'),
  M('Где образуется первичная моча?','В капсуле нефрона',['В почечных канальцах','В мочевом пузыре','В мочеточнике'],'В клубочке кровь фильтруется, и в капсулу попадает плазма без крупных белков — около 150 л в сутки.'),
  M('Почему вторичной мочи образуется всего около 1,5 л в сутки?','В канальцах происходит обратное всасывание',['Почки фильтруют мало крови','Часть мочи испаряется','Вода выводится с потом'],'Из 150 л первичной мочи обратно в кровь всасываются вода, глюкоза и нужные соли, остаётся около 1,5 л вторичной мочи.'),
  M('Какое вещество — главный конечный продукт белкового обмена?','Мочевина',['Глюкоза','Гликоген','Углекислый газ'],'Избыток аминокислот обезвреживается в печени с образованием мочевины, которую выводят почки.'),

  M('Недостаток какого витамина вызывает цингу?','C',['A','D','B₁'],'При цинге кровоточат дёсны и выпадают зубы. Витамин C есть в шиповнике, чёрной смородине, цитрусовых, квашеной капусте.'),
  M('Недостаток какого витамина вызывает куриную слепоту?','A',['C','D','B₆'],'Витамин A нужен для образования зрительного пигмента, поэтому при его нехватке ухудшается сумеречное зрение.'),
  M('Что происходит с сосудами кожи в жару?','Расширяются, и теплоотдача растёт',['Сужаются, и теплоотдача растёт','Расширяются, и теплоотдача падает','Не меняются'],'Приток крови к коже усиливается, тело краснеет и отдаёт больше тепла; дополнительно охлаждает испарение пота.'),
  O('Расставь органы по пути мочи',['Почка','Мочеточник','Мочевой пузырь','Мочеиспускательный канал'],'Моча образуется в почках, по мочеточникам поступает в пузырь, накапливается там и выводится наружу.'),
 ]},
{id:'10d',subject:'bio',grade:10,name:'Химический состав клетки',short:'Вода, белки, углеводы, липиды, АТФ',n:6,
 rule:'Вопросы о веществах клетки и их функциях.',
 bank:[
  M('Какое вещество преобладает в клетке по массе?','Вода',['Белки','Углеводы','Жиры'],'На воду приходится 70–80 % массы клетки. Она растворитель, участник реакций и переносчик веществ.'),
  M('Сколько видов аминокислот образуют природные белки?','20',['4','64','46'],'Из 20 аминокислот в разном порядке строятся все белки. 4 — число видов нуклеотидов, 64 — число кодонов.'),

  M('Какой углевод служит запасным у животных?','Гликоген',['Крахмал','Целлюлоза','Хитин'],'Гликоген откладывается в печени и мышцах. Крахмал запасают растения, целлюлоза и хитин выполняют строительную функцию.'),

  M('Сколько энергии выделяется при расщеплении 1 г жира?','Около 38 кДж',['Около 17 кДж','Около 4 кДж','Около 100 кДж'],'Жиры вдвое энергоёмче углеводов и белков (около 17 кДж на грамм), поэтому служат запасом энергии и источником воды.'),
  M('Сколько макроэргических связей в молекуле АТФ?','Две',['Одна','Три','Ни одной'],'АТФ содержит три остатка фосфорной кислоты; две связи между ними макроэргические — при разрыве каждой выделяется около 40 кДж/моль.'),
 ]},
{id:'10e',subject:'bio',grade:10,name:'Обмен веществ в клетке',short:'Фотосинтез, дыхание, АТФ',n:6,
 rule:'Энергетический и пластический обмен: где что происходит и сколько энергии даёт.',
 bank:[
  M('Где происходит световая фаза фотосинтеза?','В тилакоидах (гранах) хлоропласта',['В строме хлоропласта','В митохондриях','В цитоплазме'],'В мембранах тилакоидов расположен хлорофилл. Темновая фаза идёт в строме — жидкости вокруг гран.'),
  M('Из чего образуется кислород при фотосинтезе?','Из воды при её фотолизе',['Из углекислого газа','Из глюкозы','Из АТФ'],'Под действием света вода расщепляется на водород, электроны и кислород. Кислород — побочный продукт и выделяется наружу.'),

  M('Где происходит кислородный этап энергетического обмена?','В митохондриях',['В цитоплазме','В ядре','В рибосомах'],'На кристах митохондрий работает дыхательная цепь, здесь образуется основная часть АТФ. Гликолиз идёт в цитоплазме.'),
  M('Что образуется при гликолизе?','Две молекулы ПВК и 2 АТФ',['Шесть молекул CO₂','Глюкоза и кислород','36 молекул АТФ'],'Гликолиз — бескислородное расщепление глюкозы в цитоплазме до пировиноградной кислоты с небольшим выходом энергии.'),
  M('Как иначе называют пластический обмен?','Ассимиляция',['Диссимиляция','Катаболизм','Гликолиз'],'Пластический обмен (ассимиляция, анаболизм) — синтез сложных веществ с затратой энергии. Энергетический обмен — диссимиляция.'),
  M('Какие организмы способны к хемосинтезу?','Серобактерии и нитрифицирующие бактерии',['Зелёные растения','Грибы','Простейшие'],'Хемосинтетики создают органику за счёт энергии окисления неорганических веществ, а не света. Открыл их С. Н. Виноградский.'),
  O('Расставь этапы энергетического обмена',['Подготовительный','Бескислородный (гликолиз)','Кислородный'],'Сначала крупные молекулы расщепляются до мономеров, затем глюкоза без кислорода превращается в ПВК, и только в митохондриях идёт полное окисление.'),
 ]},
{id:'10f',subject:'bio',grade:10,name:'Вирусы и прокариоты',short:'Неклеточные формы жизни, бактериальная клетка',n:6,

 bank:[

  M('Какие органоиды есть у бактерий?','Рибосомы',['Митохондрии','Аппарат Гольджи','Лизосомы'],'У прокариот нет мембранных органоидов, но есть рибосомы — на них идёт синтез белка.'),

 rule:'Вопросы о методах выведения сортов и пород и о современной биотехнологии.',
 bank:[
  M('Кто создал учение о центрах происхождения культурных растений?','Н. И. Вавилов',['И. В. Мичурин','Г. Мендель','Т. Морган'],'Николай Вавилов собрал мировую коллекцию семян и показал, что наибольшее разнообразие сортов сосредоточено в районах их происхождения.'),
  M('О чём говорит закон гомологических рядов Н. И. Вавилова?','Близкие виды имеют сходные ряды наследственной изменчивости',['Признаки наследуются независимо','Гены расположены в хромосомах линейно','Виды неизменны'],'Зная формы изменчивости у одного вида, можно предсказать такие же у родственного — это помогает искать нужные признаки для селекции.'),
  M('Что такое гетерозис?','Повышенная мощность и урожайность гибридов первого поколения',['Появление чистых линий','Удвоение набора хромосом','Близкородственное скрещивание'],'Гетерозис проявляется при скрещивании разных чистых линий, но уже во втором поколении ослабевает.'),
  M('Как получают чистые линии растений?','Многократным самоопылением',['Межвидовым скрещиванием','Полиплоидией','Клонированием'],'Самоопыление быстро переводит гены в гомозиготное состояние. Такие линии потом скрещивают для получения гетерозисных гибридов.'),
  M('Что такое полиплоидия?','Кратное увеличение числа хромосом',['Изменение одного гена','Потеря участка хромосомы','Обмен участками хромосом'],'Полиплоидные растения обычно крупнее и урожайнее. У животных полиплоидия почти не встречается.'),
  M('Какой основной метод селекции микроорганизмов?','Искусственный мутагенез с последующим отбором',['Гибридизация','Полиплоидия','Близкородственное скрещивание'],'Микроорганизмы размножаются быстро, поэтому выгодно вызвать множество мутаций и отобрать самые продуктивные штаммы.'),
  M('Как получают человеческий инсулин в промышленности?','С помощью бактерий со встроенным геном человека',['Выделяют из крови доноров','Синтезируют из аминокислот вручную','Получают из растений'],'Это пример генной инженерии: ген инсулина встраивают в плазмиду бактерии, и та производит нужный белок.'),
  M('Что такое клонирование?','Получение генетически идентичных копий организма',['Скрещивание разных видов','Выведение новой породы отбором','Удвоение числа хромосом'],'Первым клонированным млекопитающим стала овца Долли (1996 год): ядро клетки взрослой овцы пересадили в яйцеклетку.'),
 ]},
{id:'11d',subject:'bio',grade:11,name:'Антропогенез и биосфера',short:'Происхождение человека, оболочка жизни',n:6,
 rule:'Вопросы о происхождении человека и о биосфере.',
 bank:[
  M('Кто создал учение о биосфере?','В. И. Вернадский',['Ч. Дарвин','К. Линней','А. Тенсли'],'Владимир Вернадский показал, что живые организмы — мощная геологическая сила, преобразующая облик планеты.'),
  M('Что Вернадский называл живым веществом?','Совокупность всех живых организмов планеты',['Только растения','Органические остатки в почве','Запасы нефти и угля'],'Живое вещество выполняет газовую, концентрационную и окислительно-восстановительную функции в биосфере.'),
  M('Чем ограничена верхняя граница биосферы?','Озоновым слоем на высоте около 20–25 км',['Границей облаков','Высотой гор','Орбитой спутников'],'Выше озонового экрана жёсткое ультрафиолетовое излучение губительно для живого.'),
  M('Какие факторы антропогенеза называют социальными?','Труд, речь и общественный образ жизни',['Наследственную изменчивость','Борьбу за существование','Естественный отбор'],'Биологические факторы (изменчивость, отбор) действовали на ранних этапах, позже ведущую роль стали играть социальные.'),
  M('Какая раса не выделяется в современной классификации?','Австралопитекская',['Европеоидная','Монголоидная','Негроидная'],'Австралопитеки — вымершие предки человека, а не раса. Все современные люди относятся к одному виду Homo sapiens.'),
  M('Какой газ главным образом вызывает парниковый эффект?','Углекислый газ',['Кислород','Азот','Водород'],'CO₂ пропускает солнечные лучи, но задерживает тепловое излучение Земли. Его количество растёт из-за сжигания топлива.'),
  M('Что разрушает озоновый слой?','Фреоны',['Углекислый газ','Водяной пар','Метан'],'Фреоны применялись в холодильниках и аэрозолях. Сейчас их производство ограничено международными соглашениями.'),
  O('Расставь предков человека в порядке появления',['Австралопитек','Человек умелый','Человек прямоходящий','Неандерталец','Кроманьонец'],'Австралопитеки ходили на двух ногах, человек умелый делал первые орудия, прямоходящий освоил огонь, кроманьонец — уже человек современного типа.'),
 ]},

{id:'c8d',subject:'chem',grade:8,name:'Кислород, водород и вода',short:'Получение, свойства, распознавание',n:6,
 rule:'Важнейшие вещества курса 8 класса: как их получают, собирают и распознают.',
 bank:[
  M('Как получают кислород в лаборатории?','Разложением перманганата калия при нагревании',['Действием кислоты на цинк','Горением серы','Выпариванием воды'],'2KMnO₄ → K₂MnO₄ + MnO₂ + O₂↑. Также кислород получают разложением пероксида водорода и бертолетовой соли.'),
  M('Как доказать, что в сосуде кислород?','Тлеющая лучинка ярко вспыхивает',['Лучинка гаснет','Слышен хлопок','Известковая вода мутнеет'],'Кислород поддерживает горение. Лучинка гаснет в углекислом газе и азоте, хлопок даёт водород.'),
  M('Как получают водород в лаборатории?','Действием соляной кислоты на цинк',['Нагреванием мела','Разложением воды светом','Горением угля'],'Zn + 2HCl → ZnCl₂ + H₂↑. Это реакция замещения: активный металл вытесняет водород из кислоты.'),
  M('Почему смесь водорода с воздухом опасна?','Она взрывается при поджигании',['Она ядовита','Она разъедает стекло','Она самовоспламеняется на свету'],'Смесь водорода с кислородом называют гремучим газом. Перед поджиганием водород обязательно проверяют на чистоту.'),
  M('Какова массовая доля водорода в воде H₂O?','Около 11 %',['Около 50 %','Около 33 %','Около 89 %'],'M(H₂O) = 18 г/моль, на водород приходится 2 г. 2 : 18 · 100 % ≈ 11 %. Остальные 89 % — кислород.'),
  M('Чем вызвана жёсткость воды?','Растворёнными солями кальция и магния',['Растворённым кислородом','Поваренной солью','Углекислым газом'],'Из-за этих солей плохо мылится мыло и образуется накипь. Временную жёсткость снимают кипячением.'),
  M('Что получится при растворении в воде оксида кальция?','Щёлочь Ca(OH)₂',['Кислота','Соль','Ничего не произойдёт'],'Основные оксиды активных металлов реагируют с водой, образуя щёлочи. Кислотные оксиды, например SO₃, дают кислоты.'),
  M('Что такое дистиллированная вода?','Вода, очищенная перегонкой',['Кипячёная вода','Минеральная вода','Вода со льдом'],'При перегонке вода испаряется и конденсируется, а растворённые соли остаются. Такую воду используют в лабораториях и аккумуляторах.'),
 ]},
{id:'c9d',subject:'chem',grade:9,name:'Генетическая связь классов',short:'Цепочки превращений веществ',n:5,
 rule:'Выстрой цепочки превращений, нажимая на формулы по порядку, и ответь на вопросы о связи классов веществ.',
 bank:[
  O('Выстрой цепочку превращений, начиная с простого вещества',['Ca','CaO','Ca(OH)₂','CaCO₃'],'Металл горит до оксида, основный оксид с водой даёт щёлочь, щёлочь с углекислым газом — соль: Ca → CaO → Ca(OH)₂ → CaCO₃.'),
  O('Выстрой цепочку превращений, начиная с простого вещества',['S','SO₂','SO₃','H₂SO₄','Na₂SO₄'],'Сера горит до SO₂, он окисляется до SO₃, кислотный оксид с водой даёт кислоту, кислота со щёлочью — соль.'),
  O('Выстрой цепочку превращений, начиная с простого вещества',['Cu','CuO','CuSO₄','Cu(OH)₂'],'Медь при нагревании на воздухе даёт чёрный CuO, он растворяется в серной кислоте до соли, а щёлочь осаждает голубой Cu(OH)₂.'),
  M('Какой оксид соответствует серной кислоте H₂SO₄?','SO₃',['SO₂','H₂S','S'],'Степень окисления серы в кислоте +6, такая же она в оксиде SO₃. Оксиду SO₂ отвечает сернистая кислота H₂SO₃.'),
  M('Какой гидроксид соответствует оксиду натрия Na₂O?','NaOH',['Na₂CO₃','NaCl','H₂O'],'Основному оксиду отвечает основание того же металла. Na₂O + H₂O → 2NaOH.'),
  M('С чем реагирует основный оксид?','С кислотами и кислотными оксидами',['Со щелочами','С основаниями','С солями активных металлов'],'Основные и кислотные свойства противоположны, поэтому такие вещества и реагируют друг с другом: CaO + CO₂ → CaCO₃.'),
  M('Что образуется при реакции кислоты с основанием?','Соль и вода',['Соль и водород','Оксид и водород','Две новые кислоты'],'Это реакция нейтрализации, частный случай реакции обмена: NaOH + HCl → NaCl + H₂O.'),
  M('Какой оксид не реагирует с водой?','CuO',['Na₂O','CaO','SO₃'],'Оксиду меди отвечает нерастворимое основание Cu(OH)₂, поэтому прямо с водой он не взаимодействует. Его получают косвенно — через соль.'),
 ]},
{id:'c9e',subject:'chem',grade:9,name:'Неметаллы и их соединения',short:'Сера, азот, углерод, качественные реакции',n:6,
 rule:'Свойства важнейших неметаллов и способы распознавания их соединений.',
 bank:[
  M('Чем озон отличается от кислорода?','Числом атомов в молекуле',['Числом протонов в ядре','Зарядом частиц','Числом электронных слоёв'],'O₂ и O₃ — аллотропные модификации одного элемента. Озон имеет резкий запах и гораздо более сильный окислитель.'),
  M('Какой газ преобладает в воздухе?','Азот',['Кислород','Углекислый газ','Аргон'],'Азота около 78 % по объёму, кислорода около 21 %, на остальные газы приходится примерно 1 %.'),
  M('Как правильно разбавлять концентрированную серную кислоту?','Лить кислоту тонкой струёй в воду',['Лить воду в кислоту','Смешивать одновременно','Разбавлять кислоту льдом'],'При разбавлении выделяется много теплоты. Если лить воду в кислоту, она вскипает и разбрызгивается.'),
  M('Какое свойство проявляет концентрированная серная кислота с сахаром и бумагой?','Водоотнимающее: вещество обугливается',['Восстановительное','Охлаждающее','Нейтрализующее'],'Кислота отнимает от углеводов воду, остаётся пористый уголь. Поэтому она опасна для кожи и тканей.'),
  M('Какая качественная реакция на хлорид-ион?','Нитрат серебра даёт белый творожистый осадок',['Известковая вода мутнеет','Выделяется бурый газ','Появляется малиновое окрашивание'],'Ag⁺ + Cl⁻ → AgCl↓. Осадок не растворяется в азотной кислоте и темнеет на свету.'),
  M('Как распознать карбонат-ион в растворе?','Добавить кислоту: раствор вскипает, выделяется газ',['Добавить щёлочь','Нагреть раствор','Добавить поваренную соль'],'CO₃²⁻ + 2H⁺ → H₂O + CO₂↑. Выделяющийся газ мутит известковую воду.'),
  M('Чем опасен угарный газ CO?','Он прочно связывается с гемоглобином крови',['Он разъедает кожу','Он имеет резкий запах','Он вызывает ожоги дыхательных путей'],'Гемоглобин перестаёт переносить кислород, наступает кислородное голодание. Газ не имеет цвета и запаха, поэтому особенно опасен.'),
  M('Что является главным компонентом песка и кварца?','Оксид кремния SiO₂',['Карбонат кальция','Оксид алюминия','Хлорид натрия'],'SiO₂ — кислотный оксид с очень прочной атомной решёткой, поэтому песок тугоплавок и не растворяется в воде.'),
 ]},
{id:'c10d',subject:'chem',grade:10,name:'Кислородсодержащие соединения',short:'Спирты, альдегиды, кислоты, эфиры',n:6,
 rule:'Функциональные группы, свойства и применение кислородсодержащих органических веществ.',
 bank:[
  M('Какая функциональная группа у альдегидов?','–CHO',['–OH','–COOH','–NH₂'],'Альдегидная группа содержит углерод, связанный двойной связью с кислородом и одним атомом водорода. Группа –COOH принадлежит кислотам, –OH — спиртам.'),
  M('Сколько гидроксогрупп в молекуле глицерина?','Три',['Одна','Две','Четыре'],'Глицерин C₃H₅(OH)₃ — трёхатомный спирт. Этиленгликоль двухатомный, этанол одноатомный.'),
  M('Какая качественная реакция на фенол?','Фиолетовое окрашивание с хлоридом железа(III)',['Серебряное зеркало','Синий цвет с иодом','Обесцвечивание бромной воды без осадка'],'С FeCl₃ фенол даёт характерное фиолетовое окрашивание. С бромной водой он тоже реагирует, но при этом выпадает белый осадок.'),
  M('Где применяют этиленгликоль?','В антифризах',['В производстве мыла','Как пищевой краситель','Как удобрение'],'Водные растворы этиленгликоля замерзают при низкой температуре, поэтому их заливают в системы охлаждения. Вещество ядовито.'),
  M('Что такое формалин?','Водный раствор формальдегида',['Раствор уксусной кислоты','Смесь спирта и воды','Раствор фенола'],'Формалин свёртывает белки, поэтому используется как дезинфицирующее средство и консервант биологических препаратов.'),
  M('В каком веществе содержится муравьиная кислота?','В выделениях муравьёв и жгучих волосках крапивы',['В лимоне','В молоке','В яблоках'],'Именно она вызывает жжение при укусе муравья и ожоге крапивой. В лимоне лимонная кислота, в молоке — молочная.'),
  M('Что получают при омылении жиров щёлочью?','Мыло и глицерин',['Сложный эфир и воду','Спирт и альдегид','Крахмал и глюкозу'],'Жир — сложный эфир глицерина. Щёлочь разрушает эфирные связи, образуя соли высших кислот (мыло) и глицерин.'),
  M('Чем пахнут сложные эфиры низших кислот и спиртов?','Фруктами и цветами',['Тухлыми яйцами','Аммиаком','Ничем'],'Поэтому их применяют как пищевые ароматизаторы и в парфюмерии. Например, этилацетат пахнет грушей.'),
 ]},
{id:'c10e',subject:'chem',grade:10,name:'Биополимеры и пластмассы',short:'Жиры, углеводы, белки, полимеры',n:6,
 rule:'Вещества живых организмов и синтетические полимеры.',
 bank:[
  M('Чем являются жиры по химической природе?','Сложными эфирами глицерина и высших карбоновых кислот',['Многоатомными спиртами','Углеводами','Белками'],'Молекула жира состоит из остатка глицерина и трёх остатков жирных кислот, поэтому жиры называют триглицеридами.'),
  M('Почему растительные масла жидкие?','В их составе преобладают непредельные кислоты',['Они содержат больше воды','У них меньше молекулярная масса','Они не содержат глицерина'],'Двойные связи мешают молекулам плотно укладываться. При гидрировании масла превращаются в твёрдый маргарин.'),
  M('Какова молекулярная формула глюкозы?','C₆H₁₂O₆',['C₁₂H₂₂O₁₁','C₆H₆','C₂H₅OH'],'C₁₂H₂₂O₁₁ — сахароза, C₆H₆ — бензол, C₂H₅OH — этанол.'),
  M('Какая качественная реакция на крахмал?','Синее окрашивание с раствором иода',['Фиолетовое с FeCl₃','Серебряное зеркало','Красное окрашивание с лакмусом'],'Иод даёт с крахмалом характерный синий цвет. Так проверяют наличие крахмала в картофеле, хлебе и муке.'),
  M('Какая связь соединяет аминокислоты в белке?','Пептидная',['Водородная','Ионная','Сложноэфирная'],'Пептидная связь –CO–NH– образуется между карбоксильной группой одной аминокислоты и аминогруппой другой с выделением воды.'),

/* ---------- Сборка уровня ---------- */
function buildLevel(L){
  let tasks = shuffle(L.bank).slice(0,L.n);
  if(L.extra) tasks = tasks.concat(L.extra());
  if(L.id==='11b'){ // цепи первыми
    tasks.sort((a,b)=>(a.type==='order'?0:1)-(b.type==='order'?0:1));
  } else if(!L.extra) tasks = shuffle(tasks);
  return tasks.map(t=>prepare(t,L));
}
function prepare(t,L){
  const c = {...t, mistake:false, picked:null, src:L};
  if(t.type==='mc') c.opts = shuffle([t.ans,...[...new Set(t.wrong)].filter(w=>w!==t.ans).slice(0,3)]);
  if(t.type==='balance'){ c.cur = t.co.map(()=>1); c.hint=''; }
  if(t.type==='card') c.opts = L.cats;
  if(t.type==='dna') c.pos = 0;
  if(t.type==='order'){ c.pool = shuffle(t.items); c.chosen = 0; }
  return c;
}
/* Викторина: вопросы из всех уровней, темы распределены равномерно */
const QUIZ = {quiz10:{n:10,s:'bio'},quiz20:{n:20,s:'bio'},quiz30:{n:30,s:'bio'},cquiz10:{n:10,s:'chem'},cquiz20:{n:20,s:'chem'},cquiz30:{n:30,s:'chem'}};
function buildQuiz(n,subj){
  const decks = LEVELS.filter(L=>L.subject===subj).map(L=>{
    let d = L.bank.map(t=>[t,L]);
    if(L.quizExtra) d = d.concat(L.quizExtra().map(t=>[t,L]));
    return shuffle(d);
  });
  const picked = [];
  let order = shuffle(decks.map((_,i)=>i));
  while(picked.length<n){
    let added=false;
    for(const i of order){ if(picked.length>=n) break; const x=decks[i].pop(); if(x){picked.push(x); added=true;} }
    if(!added) break;
    order = shuffle(order);
  }
  return shuffle(picked).map(([t,L])=>prepare(t,L));
}

let S = null;
const task = () => S.tasks[S.q];
function startLevel(id){
  const quiz = QUIZ[id];
  const L = quiz ? {id, quiz:true, subject:quiz.s, name:`Викторина: ${SUBJ[quiz.s].name.toLowerCase()}`, short:`${quiz.n} вопросов`, n:quiz.n} : LEVELS.find(l=>l.id===id);
  S = {L, tasks:quiz?buildQuiz(quiz.n,quiz.s):buildLevel(L), missed:new Set(), q:0, lives:3, score:0, streak:0, ok:0, total:0, sheet:null, shakeKey:null, retries:(S&&S.L.id===id)?S.retries:0};
  intro();
}
function loseLife(key){
  S.lives--; S.streak=0; task().mistake=true; S.shakeKey=key;
  try{ navigator.vibrate && navigator.vibrate(120) }catch(e){}
}
function finishTask(ok, extra){
  const t = task(); S.total++;
  const clean = ok && !t.mistake;
  if(!clean) S.missed.add(t.src);
  if(clean){ S.ok++; S.streak++; S.score += 100 + (S.streak-1)*20; }
  else if(ok){ S.score += 30; }
  S.sheet = {good:clean, ok, ...extra};
  renderTask();
}
function next(){
  S.sheet=null;
  if(S.lives<=0) return gameOver();
  S.q++;
  if(S.q>=S.tasks.length) return levelDone();
  renderTask();
}

function renderTask(){
  const t = task(); let body='';
  if(t.type==='dna'){
    const trip = fn => { let h=''; for(let i=0;i<t.strand.length;i+=3){ h+=`<div class="triplet">${[i,i+1,i+2].map(fn).join('')}</div>` } return h };
    body = `<p class="q">Собери иРНК по матричной цепи ДНК</p>
      <p class="label">ДНК 3′→5′</p>
      <div class="strand">${trip(i=>`<span class="nt n-${NCLS[t.strand[i]]}">${t.strand[i]}</span>`)}</div>
      <p class="label">иРНК 5′→3′</p>
      <div class="strand">${trip(i=>{
        if(i<t.pos){const r=COMP[t.strand[i]];return `<span class="nt n-${NCLS[r]}">${r}</span>`}
        return `<span class="nt empty ${i===t.pos?'cur':''}">·</span>`})}</div>
      <div class="pad ${S.shakeKey==='pad'?'shake':''}">${['А','У','Г','Ц'].map(n=>`<button class="n-${NCLS[n]}" data-nt="${n}" aria-label="Нуклеотид ${n}">${n}</button>`).join('')}</div>`;
  } else if(t.type==='balance'){
    const n=t.re.length;
    const side=(arr,off)=>arr.map((f,i)=>`<span class="sub"><button class="coef ${t.cur[off+i]===1?'one':''}" data-coef="${off+i}" aria-label="Коэффициент перед ${f}: ${t.cur[off+i]}">${t.cur[off+i]}</button><span class="f">${f}</span></span>`).join('<span class="op">+</span>');
    body = `<p class="q">Расставь коэффициенты в уравнении</p>
      <p class="label">Нажимай на число перед формулой: 1 → 2 → … → 6 → 1</p>
      <div class="eq ${S.shakeKey==='eq'?'shake':''}">${side(t.re,0)}<span class="op">→</span>${side(t.pr,n)}</div>
      <p class="hint-line">${t.hint||''}</p>
      <button class="primary" data-act="check">Проверить</button>`;
  } else if(t.type==='order'){
    const done = t.items.slice(0,t.chosen);
    body = `<p class="q">${t.q}</p>
      <div class="chain">${done.length?done.map(x=>`<span class="link">${x}</span>`).join('<span class="arr">→</span>'):'<span class="hint">Нажимай на элементы по порядку</span>'}</div>
      <div class="pool">${t.pool.map((x,i)=>done.includes(x)?'':`<button data-org="${i}" class="${S.shakeKey===i?'shake':''}">${x}</button>`).join('')}</div>`;
  } else {
    const many = t.opts.length>4;
    body = `${t.type==='card'?`<p class="label">${t.src.catQ||'К какой группе относится?'}</p><div class="card">${t.q}</div>`:`<p class="q">${t.q}</p>`}
      <div class="opts ${many?'many':''}">${t.opts.map((o,i)=>{
        let c=''; if(t.picked!=null){ if(o===t.ans)c='right'; else if(o===t.picked)c='wrong'; }
        return `<button class="opt ${c}" data-opt="${i}" ${t.picked!=null?'disabled':''}>${o}</button>`}).join('')}</div>`;
  }
  let sh='';
  if(S.sheet){
    const x=S.sheet;
    sh = `<div class="sheet ${x.good?'':'bad'}" role="status"><div class="sheet-in">
      <h3>${x.title}</h3>
      ${x.yours?`<p class="yours">${x.yours}</p>`:''}
      <div class="sol"><b>${x.solTitle||'Разбор'}</b>${x.solution?x.solution+'<br>':''}${t.expl}</div>
      <button class="primary" data-act="next">${S.lives<=0?'Дальше':S.q===S.tasks.length-1?'Завершить уровень':'Следующее задание'}</button></div></div>`;
  }
  $app.innerHTML = `<main>${hud()}${body}</main>${sh}`;
  S.shakeKey = null;
  if(S.sheet){ const b=document.querySelector('.sheet .primary'); b&&b.focus({preventScroll:true}); }
}
function saveResult(){
  const pct = S.total? S.ok/S.total : 0;
  const stars = pct===1?3:pct>=.7?2:1;
  const prev = PROG[S.L.id]||{best:0,stars:0};
  const rec = S.score>prev.best;
  PROG[S.L.id] = {best:Math.max(prev.best,S.score), stars:Math.max(prev.stars,stars)};
  saveProg(PROG);
  return {stars,rec,pct};
}
function nextLevelId(){ if(S.L.quiz) return null; const i=LEVELS.indexOf(S.L), n=LEVELS[i+1]; return n&&n.subject===S.L.subject?n.id:null; }
function levelDone(){
  const r = saveResult(); const nx = nextLevelId();
  const verdict = r.pct===1?'Без единой ошибки.':r.pct>=.7?'Хороший результат. Разбери ошибки и попробуй на три звезды.':'Тема требует повторения — перечитай разборы и пройди уровень ещё раз.';
  $app.innerHTML = `<main class="result">
    <p class="step muted">${S.L.quiz?S.L.name:`${S.L.grade} класс · ${S.L.name}`}</p>
    <h2>${S.L.quiz?'Викторина завершена':'Уровень пройден'}</h2>
    <div class="stars">${[0,1,2].map(i=>i<r.stars?'★':'<span class="off">★</span>').join('')}</div>
    <div class="big">${S.score}</div>
    <p class="rank">Верно с первого раза: ${S.ok} из ${S.total}${r.rec?' · новый рекорд':''}</p>
    <p class="tip">${verdict}</p>
    ${S.missed.size?`<p class="label">Темы с ошибками — их стоит повторить:</p><div style="margin-bottom:22px">${[...S.missed].sort((a,b)=>LEVELS.indexOf(a)-LEVELS.indexOf(b)).map(L=>`<button class="lvl" data-level="${L.id}"><span><b>${L.name}</b><small>${L.grade} класс · открыть уровень</small></span><span class="muted">→</span></button>`).join('')}</div>`:''}
    ${nx?`<button class="primary" data-level="${nx}">Следующий уровень: ${LEVELS.find(l=>l.id===nx).name}</button>`:''}
    <button class="secondary" data-level="${S.L.id}">${S.L.quiz?'Новая викторина':'Пройти ещё раз'}</button>
    <button class="secondary" data-act="menu">Все уровни</button>
  </main>`;
}
function gameOver(){
  S.retries++;
  $app.innerHTML = `<main class="result">
    <p class="step muted">${S.L.quiz?S.L.name:`${S.L.grade} класс · ${S.L.name}`}</p>
    <h2>Клетки закончились</h2>
    <p class="tip" style="margin-top:18px">Ты дошёл до задания ${S.q+1} из ${S.tasks.length} и набрал ${S.score} очков. ${S.L.quiz?'Начни викторину заново: жизни восстановятся, вопросы будут новыми.':'Продолжи с этого же уровня: жизни восстановятся, задания перемешаются.'}</p>
    <button class="primary" data-level="${S.L.id}">${S.L.quiz?'Продолжить викторину':'Продолжить уровень'}</button>
    <button class="secondary" data-act="menu">Выбрать другой уровень</button>
  </main>`;
}

/* ---------- Ввод ---------- */
$app.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.act==='reviews') return reviewsScreen();
  if(b.dataset.act==='rv-save') return rvSave();
  if(b.dataset.act==='rv-send') return rvSend();
  if(b.dataset.act==='rv-again'){ RV.sent = false; RV.note = ''; return reviewsScreen(); }
  if(b.dataset.act==='rv-del') return rvDelete(b.dataset.id);
  if(b.dataset.star){ RV.draft.rating=+b.dataset.star; RV.editing=true; RV.note=''; return reviewsScreen(); }
  if(b.dataset.subject){ UI.subject=b.dataset.subject; if(!SUBJ[UI.subject].grades.includes(UI.grade)) UI.grade=SUBJ[UI.subject].grades[0]; try{localStorage.setItem('biolab-subject',UI.subject);localStorage.setItem('biolab-grade',UI.grade)}catch(e){} return menu(); }
  if(b.dataset.grade){ UI.grade=+b.dataset.grade; try{localStorage.setItem('biolab-grade',UI.grade)}catch(e){} return menu(); }
  if(b.dataset.level) return startLevel(b.dataset.level);
  const act = b.dataset.act;
  if(act==='menu'){ S=null; return menu(); }
  if(act==='go'){ UI.screen='game'; return renderTask(); }
  if(act==='next') return next();
  if(!S || S.sheet) return;
  const t = task();
  if(b.dataset.coef!=null){ const i=+b.dataset.coef; t.cur[i]=t.cur[i]%6+1; t.hint=''; return renderTask(); }
  if(act==='check'){
    const eq = co => { const n=t.re.length, part=(arr,o)=>arr.map((f,i)=>(co[o+i]>1?co[o+i]:'')+f).join(' + '); return part(t.re,0)+' → '+part(t.pr,n); };
    const same = t.cur.every((v,i)=>v===t.co[i]);
    const prop = t.cur.every((v,i)=>v*t.co[0]===t.co[i]*t.cur[0]);
    if(same) return finishTask(true,{title:t.mistake?'Уравнено, но с ошибками':'Уравнение уравнено верно',solTitle:'Решение',solution:eq(t.co)});
    if(prop){ t.hint='Баланс атомов верный, но коэффициенты можно сократить до наименьших целых.'; return renderTask(); }
    loseLife('eq');
    if(S.lives<=0) return finishTask(false,{title:'Уравнение не уравнено',yours:`Твой вариант: ${eq(t.cur)}`,solTitle:'Решение',solution:eq(t.co)});
    t.hint='Число атомов слева и справа не совпадает. Пересчитай каждый элемент.';
    return renderTask();
  }
  if(b.dataset.nt){
    const need = COMP[t.strand[t.pos]];
    if(b.dataset.nt===need){
      t.pos++; S.score+=10;
      if(t.pos===t.strand.length) return finishTask(true,{
        title:t.mistake?'Цепь собрана, но с ошибками':'Цепь собрана верно',
        solTitle:'Решение', solution:`ДНК: ${t.strand.match(/.{3}/g).join(' ')}<br>иРНК: ${[...t.strand].map(c=>COMP[c]).join('').match(/.{3}/g).join(' ')}`});
    } else {
      t.lastWrong = {got:b.dataset.nt, need, at:t.strand[t.pos]};
      loseLife('pad');
      if(S.lives<=0) return finishTask(false,{title:'Ошибка в транскрипции',
        yours:`Напротив «${t.lastWrong.at}» ты поставил «${t.lastWrong.got}», а нужно «${t.lastWrong.need}».`,
        solTitle:'Решение', solution:`иРНК: ${[...t.strand].map(c=>COMP[c]).join('').match(/.{3}/g).join(' ')}`});
    }
    return renderTask();
  }
  if(b.dataset.org!=null){
    const pick = t.pool[+b.dataset.org];
    if(pick===t.items[t.chosen]){
      t.chosen++;
      if(t.chosen===t.items.length) return finishTask(true,{title:t.mistake?'Порядок собран, но с ошибками':'Порядок верный',
        solTitle:'Правильный порядок', solution:t.items.join(' → ')});
    } else {
      loseLife(+b.dataset.org);
      if(S.lives<=0) return finishTask(false,{title:'Порядок нарушен',
        yours:`После «${t.items[t.chosen-1]||'начала'}» ты выбрал «${pick}», а нужно «${t.items[t.chosen]}».`,
        solTitle:'Правильный порядок', solution:t.items.join(' → ')});
    }
    return renderTask();
  }
  if(b.dataset.opt!=null){
    const pick = t.opts[+b.dataset.opt]; t.picked = pick;
    if(pick===t.ans) finishTask(true,{title:'Верно',solTitle:'Почему так'});
    else { loseLife(); finishTask(false,{title:'Неверно',yours:`Твой ответ: ${pick}. Правильный ответ: <b>${t.ans}</b>.`,solTitle:'Разбор'}); }
  }
});
/* ========== ОТЗЫВЫ ========== */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Отзывы, вшитые в файл. Используются там, где нет хранилища: на обычном хостинге
   форма не работает, но сами отзывы остаются видны. Список обновляется при сборке файла. */
const RV_SEED = [
  {
    "name": "Дима",
    "who": "10 А",
    "rating": 5,
    "text": "Прикольный сайт.Викторины интересные и, главное, полезные",
    "ts": 1794914400000
  },
  {

    "who": "Ученик 11 класса",
    "rating": 5,
    "text": "Давно увлекаюсь химией и вот решил зайти на данный сайт и просто обомлел, настолько подборнооо объяснения с одном месте я еще не встречал. Разработчику большое спасибо🙏",
    "ts": 1794914000000
  },
  {
    "name": "Вадим",
    "who": "",
    "rating": 5,
    "text": "Всё понравилось, сайт отличный, надеюсь сдам на хороший балл!",

  }
];
/* Ключ формы Web3Forms: с ним отзыв с сайта уходит на почту автора.
   Пустая строка — форма отправки скрыта. */
const RV_KEY = '2fccd790-1f63-41dc-9c08-110ed20261f1';
let RV = {
  ready:false, db:null, uid:null, isOwner:false, mayWrite:null,
  list:[], loaded:false, slow:false, failed:false, unsub:null, timer:null,
  draft:{name:'', who:'', rating:0, text:''}, saving:false, sent:false, note:''
};
function rvItems(){ return RV.db ? RV.list : RV_SEED; }
function rvAvg(){ const a = rvItems(); if(!a.length) return 0; return a.reduce((s,r)=>s+(+r.rating||0),0)/a.length; }
function rvStars(n, cls){ return `<span class="stars ${cls||''}">${[1,2,3,4,5].map(i=>i<=Math.round(n)?'★':'<span class="off">★</span>').join('')}</span>`; }
function rvRerender(){ if(UI.screen === 'reviews') reviewsScreen(); else if(UI.screen === 'menu') menu(); }

async function rvInit(){
  if(RV.ready) return; RV.ready = true;
  const api = null;   // на своём хостинге хранилища нет: отзывы показываются из списка выше
  if(!api){ RV.failed = true; RV.loaded = true; rvRerender(); return; }
  let db = null, user = null;
  try{ db = await api.use('db'); }catch(e){ db = null; }
  try{ user = await api.use('user'); }catch(e){ user = null; }
  RV.db = db;
  if(user){
    try{ RV.uid = await user.id(); }catch(e){ RV.uid = null; }
    try{ RV.isOwner = !!(user.isOwner && user.isOwner()); }catch(e){ RV.isOwner = false; }
    try{ RV.mayWrite = user.can ? user.can('data.write') : null; }catch(e){ RV.mayWrite = null; }
    if(RV.mayWrite && typeof RV.mayWrite.then === 'function'){ try{ RV.mayWrite = await RV.mayWrite; }catch(e){ RV.mayWrite = null; } }
  }
  if(!db){ RV.failed = true; RV.loaded = true; rvRerender(); return; }
  rvRerender();
  RV.timer = setTimeout(()=>{ if(!RV.loaded){ RV.slow = true; rvRerender(); } }, 10000);
  try{
    RV.unsub = db.collection('reviews').orderBy('ts','desc').limit(50).onSnapshot(
      snap => {
        RV.list = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
        if(!snap.metadata.fromCache){ RV.loaded = true; RV.slow = false; clearTimeout(RV.timer); }
        const mine = RV.uid ? RV.list.find(r=>r.id===RV.uid) : null;
        if(mine && !RV.editing){ RV.draft = {name:mine.name||'', who:mine.who||'', rating:+mine.rating||0, text:mine.text||''}; }
        rvRerender();
      },
      () => { RV.failed = true; RV.loaded = true; clearTimeout(RV.timer); rvRerender(); }
    );
  }catch(e){ RV.failed = true; RV.loaded = true; rvRerender(); }
}

function reviewsScreen(){
  UI.screen = 'reviews';
  const mine = RV.uid ? RV.list.find(r=>r.id===RV.uid) : null;
  const avg = rvAvg();
  const d = RV.draft;
  const canSubmit = !!(RV.db && RV.uid) && RV.mayWrite !== false;

  const items = rvItems();
  const head = `<button class="back" data-act="menu">← К уровням</button>
    <h2>Отзывы</h2>
    <p class="muted" style="margin:6px 0 18px">${
      items.length
        ? `Средняя оценка ${avg.toFixed(1).replace('.', ',')} ${rvStars(avg)} · отзывов: ${items.length}`
        : 'Отзывов пока нет — твой может стать первым.'
    }</p>`;

  const form = canSubmit ? `<section class="rvform">
      <h3>${mine ? 'Твой отзыв' : 'Оставить отзыв'}</h3>
      <label class="fl">Имя или ник<input class="inp" data-rv="name" maxlength="40" value="${esc(d.name)}" placeholder="Например, Аня"></label>
      <label class="fl">Класс или кто ты<input class="inp" data-rv="who" maxlength="40" value="${esc(d.who)}" placeholder="Например, 11 «Б» или учитель"></label>
      <p class="fl" style="margin-bottom:6px">Оценка</p>
      <div class="rate">${[1,2,3,4,5].map(i=>`<button data-star="${i}" class="${i<=d.rating?'on':''}" aria-label="Оценка ${i} из 5">★</button>`).join('')}</div>
      <label class="fl">Отзыв<textarea class="inp area" data-rv="text" maxlength="600" rows="4" placeholder="Что понравилось, что стоит добавить">${esc(d.text)}</textarea></label>
      <button class="primary" data-act="rv-save" ${RV.saving?'disabled':''}>${RV.saving ? 'Сохраняю…' : (mine ? 'Обновить отзыв' : 'Отправить отзыв')}</button>
      ${mine ? `<button class="secondary" data-act="rv-del" data-id="${esc(mine.id)}">Удалить мой отзыв</button>` : ''}
      ${RV.note ? `<p class="rvnote">${esc(RV.note)}</p>` : ''}
    </section>` : (!RV.db && RV_KEY) ? (RV.sent ? `<section class="rvform">
      <h3>Спасибо!</h3>
      <p class="muted" style="font-size:15px">Отзыв отправлен автору игры. Он появится на этой странице после проверки.</p>
      <button class="secondary" data-act="rv-again">Написать ещё один</button>
    </section>` : `<section class="rvform">
      <h3>Оставить отзыв</h3>
      <label class="fl">Имя или ник<input class="inp" data-rv="name" maxlength="40" value="${esc(d.name)}" placeholder="Например, Аня"></label>
      <label class="fl">Класс или кто ты<input class="inp" data-rv="who" maxlength="40" value="${esc(d.who)}" placeholder="Например, 11 «Б» или учитель"></label>
      <p class="fl" style="margin-bottom:6px">Оценка</p>
      <div class="rate">${[1,2,3,4,5].map(i=>`<button data-star="${i}" class="${i<=d.rating?'on':''}" aria-label="Оценка ${i} из 5">★</button>`).join('')}</div>
      <label class="fl">Отзыв<textarea class="inp area" data-rv="text" maxlength="600" rows="4" placeholder="Что понравилось, что стоит добавить">${esc(d.text)}</textarea></label>
      <button class="primary" data-act="rv-send" ${RV.saving?'disabled':''}>${RV.saving ? 'Отправляю…' : 'Отправить отзыв'}</button>
      ${RV.note ? `<p class="rvnote">${esc(RV.note)}</p>` : ''}
      <p class="muted" style="font-size:13px;margin-top:12px">Отзыв уходит автору игры и появляется на странице после проверки.</p>
    </section>`) : `<section class="rvform">
      <h3>Оставить отзыв</h3>
      <p class="muted" style="font-size:15px">${RV.db
        ? 'Чтобы оставить отзыв, нужен доступ на уровне участника. Попроси владельца игры открыть доступ или напиши отзыв ему напрямую.'
        : 'Свой отзыв передай автору игры — он добавит его на эту страницу.'}</p>
    </section>`;

  const state = !RV.db || (RV.failed && !RV.list.length) ? ''
    : (!RV.loaded ? `<p class="muted" style="font-size:15px">${RV.slow ? 'Отзывы пока не загрузились — возможно, нет связи.' : 'Загружаю отзывы…'}</p>` : '');

  const list = items.map(r=>`<article class="rv">
      <div class="rv-top"><b>${esc(r.name) || 'Без имени'}</b>${rvStars(+r.rating||0,'sm')}</div>
      ${r.who ? `<p class="rv-who">${esc(r.who)}</p>` : ''}
      <p class="rv-text">${esc(r.text)}</p>
      ${(RV.isOwner || r.id===RV.uid) ? `<button class="rv-del" data-act="rv-del" data-id="${esc(r.id)}">Удалить</button>` : ''}
    </article>`).join('');

  $app.innerHTML = `<main class="reviews">${head}${form}${state}${list}</main>`;
}

async function rvSave(){
  const d = RV.draft;
  if(!RV.db || !RV.uid) return;
  if(!d.text.trim() || !d.rating){ RV.note = 'Поставь оценку и напиши хотя бы пару слов.'; return rvRerender(); }
  RV.saving = true; RV.note = ''; rvRerender();
  try{
    await RV.db.doc('reviews/' + RV.uid).set({
      name: d.name.trim().slice(0,40) || 'Аноним',
      who: d.who.trim().slice(0,40),
      rating: Math.max(1, Math.min(5, +d.rating||5)),
      text: d.text.trim().slice(0,600),
      ts: Date.now()
    });
    RV.note = 'Спасибо! Отзыв сохранён.'; RV.editing = false;
  }catch(e){
    RV.note = (e && e.code === 'invalid_argument')
      ? 'Сохранить не удалось: у этой учётной записи нет прав на запись.'
      : 'Сохранить не удалось, попробуй ещё раз.';
  }
  RV.saving = false; rvRerender();
}
/* Отправка отзыва на почту автора через Web3Forms — работает без регистрации у посетителя */
async function rvSend(){
  const d = RV.draft;
  if(!RV_KEY || RV.saving) return;
  if(!d.text.trim() || !d.rating){ RV.note = 'Поставь оценку и напиши хотя бы пару слов.'; return rvRerender(); }
  let last = 0;
  try{ last = +localStorage.getItem('biolab-rv-sent') || 0; }catch(e){}
  if(Date.now() - last < 60000){ RV.note = 'Отзыв уже отправлен. Следующий можно отправить через минуту.'; return rvRerender(); }
  RV.saving = true; RV.note = ''; rvRerender();
  try{
    const res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        access_key: RV_KEY,
        subject: 'Новый отзыв об игре «Биолаб и Химлаб»',
        from_name: 'Биолаб и Химлаб',
        botcheck: '',
        'Имя': d.name.trim().slice(0,40) || 'Аноним',
        'Класс': d.who.trim().slice(0,40) || '—',
        'Оценка': Math.max(1, Math.min(5, +d.rating||5)) + ' из 5',
        'Отзыв': d.text.trim().slice(0,600)
      })
    });
    const out = await res.json().catch(()=>({}));
    if(res.ok && out.success !== false){
      try{ localStorage.setItem('biolab-rv-sent', String(Date.now())); }catch(e){}
      RV.sent = true; RV.editing = false; RV.note = '';
      RV.draft = { name:'', who:'', rating:0, text:'' };
    } else {
      RV.note = 'Отправить не удалось. Попробуй ещё раз чуть позже.';
    }
  }catch(e){
    RV.note = 'Отправить не удалось — похоже, нет связи. Проверь интернет и попробуй снова.';
  }
  RV.saving = false; rvRerender();
}
async function rvDelete(id){
  if(!RV.db || !id) return;
  try{ await RV.db.doc('reviews/' + id).delete(); RV.note = 'Отзыв удалён.'; if(id===RV.uid) RV.draft = {name:'',who:'',rating:0,text:''}; }
  catch(e){ RV.note = 'Удалить не удалось.'; }
  rvRerender();
}

$app.addEventListener('input', e => {
  const f = e.target && e.target.dataset ? e.target.dataset.rv : null;
  if(f) RV.draft[f] = e.target.value;
  RV.editing = true;
});

menu();
rvInit();
